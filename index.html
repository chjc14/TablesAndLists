
<!DOCTYPE html>
<html>
<head>
    <title>Tables and Lists</title>
</head>
<body>

    <h1>Student Information</h1>

    <h2>Student Table</h2>

    <table border="1">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Branch</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>ECE</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Arjun</td>
            <td>IT</td>
        </tr>
    </table>

    <h2>Subjects (Ordered List)</h2>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>DBMS</li>
    </ol>

    <h2>Programming Languages (Unordered List)</h2>
    <ul>
        <li>C</li>
        <li>Java</li>
        <li>Python</li>
    </ul>

</body>
</html>
